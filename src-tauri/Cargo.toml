[package]
name = "pagewise"
version = "21.1.0"
description = "Local desktop PDF agent — page-wise AI analysis"
authors = ["hxddh"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pagewise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what `app.macOSPrivateApi: true` in tauri.conf.json
# requires (a transparent window with a material behind it needs it on macOS);
# tauri-build refuses to compile when the config and the feature list disagree,
# which is how 18.0.0's first CI run failed.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf-inspector = "1.25"
# Read directly for one thing only: each page's visible box. pdf-inspector
# after 1.17 reports positions relative to it (CropBox ∩ MediaBox); PageWise's
# frontend and the pdf.js annotations it draws beside them work in absolute
# user space, so inspect.rs adds the origin back. Same version pdf-inspector
# already builds, so it adds nothing to the dependency tree.
lopdf = "0.45"
tauri-plugin-dialog = "2.7.1"
# Remembering the window, and being one app rather than several.
#
# Both are desktop table stakes and neither existed: every launch reset the
# window to 1200x800 wherever the OS put it, and opening a second PDF from the
# file manager started a second copy of PageWise with its own empty state.
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# `tauri-plugin-store` is deliberately absent since 20.0: its `save()` was a
# plain `fs::write` (a torn write read back as an empty store, which the next
# save wrote over the reader's work), it swallowed the load error so the app
# could not tell "unreadable" from "empty", and its `load` command took a full
# path from the webview — `PathBuf::push` replaces the base directory for an
# absolute one, so `store:default` was a read/write primitive for any JSON file
# the app could touch. `store_io.rs` replaces all three.
# keyring 4 is a different crate. Its own docs say an application that wants to
# control which credential stores it uses "should not be linking to this library
# at all" — it should link keyring-core plus the specific stores it wants. What
# is used here instead is 4.x's `v1` compatibility shim, which keeps the 3.x
# `Entry` API exactly as the code in secrets.rs already calls it.
#
# So the feature list is `v1` and nothing else. Naming backends here would be
# theatre: the shim hard-codes its own choice per platform (apple-native on
# macOS, windows-native on Windows, zbus-secret-service elsewhere), and the
# first attempt at this upgrade listed `dbus-secret-service-keyring-store`,
# which compiled an entire second Secret Service backend that nothing called.
#
# One real behaviour change, on Linux: 3.x used `sync-secret-service`, the
# blocking backend; the shim uses the zbus one. Both talk to the same Secret
# Service, and these calls already run inside `spawn_blocking`, so nothing about
# this code's threading changes.
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true
