name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run check:secrets

      - name: Unit tests
        run: npm test

      - name: Typecheck & build frontend
        run: npm run build

      - name: Verify version sync
        run: node scripts/sync-version.mjs && git diff --exit-code VERSION package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml

  # The checks that guard the build, run on Windows.
  #
  # Three releases in a row published four assets instead of six because a check
  # added here and only ever run on Linux failed on the Windows runner and
  # nowhere else: 7.6.0 on a CRLF snapshot, 7.7.0 on `new URL(…).pathname`, and
  # 7.7.0's re-run on `path.sep` in a lookup keyed by "components/ui/Button.tsx".
  # Each was fixed by reading the next script more carefully, which caught none
  # of the following two. The mechanism is running them where they break.
  #
  # Deliberately not the whole suite and not the Rust build — this is the
  # `prebuild` chain plus the tests that shell out to it, which is where every
  # one of those three lived. Keeping it that narrow is what makes it fast
  # enough to sit on every pull request.
  windows-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run check:secrets

      - name: CSS token check
        run: npm run check:css

      - name: CSS cascade order check
        run: npm run check:css-order

      - name: Raw-button check
        run: npm run check:buttons

      # The suite's own path-and-line-ending invariants — css-hygiene.test.mjs
      # runs each of the scripts above as a subprocess and reads their output,
      # so it is the one place a script that silently prints nothing is caught.
      - name: Hygiene invariants
        run: npx vitest run scripts/css-hygiene.test.mjs

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      # Golden fixtures. `pdf-inspector` is a version range rather than a pin,
      # so these — not the manifest — are what catches a behavior regression.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  # The offline evaluation, `npm run eval`: quote location ≥ 90%, the same
  # quotes altered ≤ 1% wrongly located, search, coverage, OCR per kind of
  # page, annotation export, and the number check's false alarms. All of it was
  # committed across 13.0–16.0 and run by hand since, so nothing has held the
  # numbers it was set on.
  #
  # No model is called. `eval/extract` includes `inspect.rs` by path so it
  # builds without Tauri's GTK/WebKit dependencies, and pypdfium2 (with Pillow)
  # renders the page images the OCR suite reads.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: eval/extract

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the page renderer the OCR suite reads the corpus with
        run: pip install pypdfium2 pillow

      # The committed corpus alone does not satisfy the numbers suite: its floor
      # of 150 located claims is set on the corpus plus these two third-party
      # documents, and without them the same run locates 121 and fails. They are
      # pinned by SHA-256, so every run measures the same bytes.
      - name: Fetch the third-party documents the evaluation corpus includes
        run: npm run eval:fetch

      - name: Evaluation
        run: npm run eval

  # The DOM invariants of the running app, `npm run ui:inventory`: at most 4
  # buttons under an answer, one export entry in the chat menu and one in the
  # palette (both opening a dialog of three), at most 12 settings rows, at most
  # three citation levels. 16.0 set those numbers, and nothing has held them
  # since: a control can come back without a single red check.
  #
  # Needs a dev server on :1420 and a Chromium Playwright can drive.
  # `ui-inventory.mjs` reads PLAYWRIGHT_CHROMIUM_PATH, and its fallback is the
  # path the project's container uses, not the one `playwright install` writes
  # on a runner — hence the resolved path below.
  ui-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Point the harness at the browser Playwright installed
        run: echo "PLAYWRIGHT_CHROMIUM_PATH=$(node -p 'require("playwright").chromium.executablePath()')" >> "$GITHUB_ENV"

      - name: Start the dev server and inventory what it shows
        run: |
          nohup npm run dev > dev-server.log 2>&1 &
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:1420/; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::the dev server never answered on :1420"
            cat dev-server.log
            exit 1
          fi
          npm run ui:inventory

  # The running app's performance, `npm run perf`: boot, a 120-page open, two
  # scroll speeds, a fling's settle, a windowed jump, the thumbnail sidebar, a
  # 500-page search, a streamed answer, a 100-turn session and a scan-shaped
  # document. 18.0 measured all of these by hand before setting the budgets
  # (docs/reviews/2026-10-14-pagewise-v18-next-major-review.md §1.2); nothing
  # held them before, and "it feels slower" is not a check.
  #
  # The budgets are the measured values with room for a slower machine — this
  # job exists to catch the 5–50× regressions (an unvirtualized list, a raster
  # per scroll tick), not 20% noise, so it should not need retries to pass.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Point the probe at the browser Playwright installed
        run: echo "PLAYWRIGHT_CHROMIUM_PATH=$(node -p 'require("playwright").chromium.executablePath()')" >> "$GITHUB_ENV"

      - name: Build the frontend
        run: npm run build

      - name: Performance budgets
        run: npm run perf
